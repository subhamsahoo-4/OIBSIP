<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inbox</title>
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>
        <div class="layout">
            <main class="main">
                <h1>Contact / Query Inbox</h1>
                <p class="muted">Messages submitted by members.</p>
                <div id="list" class="grid"></div>
            </main>
        </div>
        <script src="/js/api.js"></script>
        <script src="/js/admin.js"></script>
        <script>
            (async () => {
                await shell();
                const qs = await API.get('/api/admin/contact');
                list.innerHTML = qs.map(q => `
                    <div class="card">
                        <div class="toolbar">
                            <b>${esc(q.subject)}</b>
                            <span class="muted">${date(q.createdAt)}</span>
                        </div>
                        <div>
                            <b>${esc(q.memberName)}</b> · ${esc(q.email)}
                        </div>
                        <p>${esc(q.message)}</p>
                    </div>
                `).join('') || '<div class="card">Inbox is empty.</div>';
            })();
        </script>
    </body>
</html>
