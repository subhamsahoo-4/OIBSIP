<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth">

<div class="card">

    <h1>Create account</h1>

    <p class="muted">
        Register as a library member or administrator.
    </p>

    <form id="registerForm">

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" required>

        <label for="role">Account Type</label>
        <select id="role" name="role" required>
            <option value="USER">Library User</option>
            <option value="ADMIN">Administrator</option>
        </select>

        <div id="adminCodeContainer" style="display:none">
            <label for="adminRegistrationCode">Admin Registration Code</label>
            <input
                id="adminRegistrationCode"
                name="adminRegistrationCode"
                type="password"
                autocomplete="off"
            >
            <p class="muted">
                An administrator registration code is required to create an Admin account.
            </p>
        </div>

        <button type="submit" style="width:100%;margin-top:18px">
            Register
        </button>

        <div id="msg" class="error"></div>

    </form>

    <p class="muted">
        Already registered?
        <a href="/login.html">Login</a>
    </p>

</div>

<script src="/js/api.js"></script>

<script>
const registerForm = document.getElementById('registerForm');
const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const roleInput = document.getElementById('role');
const adminCodeContainer = document.getElementById('adminCodeContainer');
const adminCodeInput = document.getElementById('adminRegistrationCode');
const message = document.getElementById('msg');

roleInput.addEventListener('change', function () {
    const isAdmin = roleInput.value === 'ADMIN';

    adminCodeContainer.style.display = isAdmin ? 'block' : 'none';
    adminCodeInput.required = isAdmin;

    if (!isAdmin) {
        adminCodeInput.value = '';
    }
});

registerForm.addEventListener('submit', async function (e) {

    e.preventDefault();
    message.textContent = '';

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const role = roleInput.value;
    const adminRegistrationCode = adminCodeInput.value.trim();

    if (!name || !email || password.length < 6) {
        message.textContent =
            'Name, email and a password of at least 6 characters are required';
        return;
    }

    if (role === 'ADMIN' && !adminRegistrationCode) {
        message.textContent = 'Admin registration code is required';
        return;
    }

    try {

        await API.post('/api/auth/register', {
            name: name,
            email: email,
            password: password,
            role: role,
            adminRegistrationCode: role === 'ADMIN'
                ? adminRegistrationCode
                : null
        });

        alert(
            role === 'ADMIN'
                ? 'Admin registration successful. Please login.'
                : 'Registration successful. Please login.'
        );

        window.location.href = '/login.html';

    } catch (err) {
        message.textContent = err.message;
    }
});
</script>

</body>
</html>
